version: '2'

volumes:
  db:
    driver: local

services:
  postgresdb:
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${POSTGRESDB_ROOT_PASSWORD}
      POSTGRES_DB: ${POSTGRESDB_DATABASE}
    ports:
      - "${POSTGRESDB_LOCAL_PORT}:${POSTGRESDB_DOCKER_PORT}"
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    depends_on:
      - postgresdb
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./.env
    ports:
      - "${NODE_LOCAL_PORT}:${NODE_DOCKER_PORT}"
    volumes:
      # - ./app/static:/app/app/static
      # Mount code for development (optional, comment out for production)
      # - .:/app
      # Монтирование Let's Encrypt сертификатов с сервера
      - /etc/letsencrypt/live/geos.icc.ru/fullchain.pem:/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/geos.icc.ru/privkey.pem:/certs/privkey.pem:ro
    environment:
      DB_HOST: postgresdb
      DB_PORT: ${POSTGRESDB_DOCKER_PORT}
      DB_USER: ${POSTGRESDB_USER}
      DB_PASSWORD: ${POSTGRESDB_ROOT_PASSWORD}
      DB_NAME: ${POSTGRESDB_DATABASE}
      PORT: ${NODE_DOCKER_PORT}
      ENABLE_CRON: ${ENABLE_CRON}
      DEBUG: ${DEBUG}
      SSL_ENABLED: ${SSL_ENABLED}
      SSL_KEY_PATH: ${SSL_KEY_PATH}
      SSL_CERT_PATH: ${SSL_CERT_PATH}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      GOTO_NUM_THREADS: ${GOTO_NUM_THREADS:-1}
    restart: unless-stopped
    command: >
      sh -c "
      /app/wait-for-it.sh postgresdb:$$POSTGRESDB_DOCKER_PORT --timeout=60 --strict -- python main.py
      "
